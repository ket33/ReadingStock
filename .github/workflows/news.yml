# 평일 저녁 뉴스룸 파이프라인 — DART 공시 감지 → 해설 기사 생성 → Supabase 저장 → 회원 다이제스트
#
# 기사 생성은 헤드리스 Claude Code(`claude -p`)로 하며, 사용자 '구독'으로 인증한다(API 과금 아님).
#   → 로컬 터미널에서 `claude setup-token`으로 발급한 토큰을
#     저장소 Settings → Secrets and variables → Actions 에 CLAUDE_CODE_OAUTH_TOKEN 으로 등록해야 한다.
#
# 대상 종목: companies 테이블(개별종목페이지 있는 기업) 전체.
#   대상이 150개를 넘으면 run.py가 자동으로 '전체 시장 1회 폴링'으로 전환 → 2000+ 상장사까지 확장.
#
# 크론 시각(UTC)은 '의도'일 뿐 — GitHub Actions 예약은 정시에 1~2시간 밀린다(공식 미보장).
#   UTC 08:00 = KST 17:00. 다이제스트는 하루 한 통이고 파이프라인은 멱등(중복 스킵)이라 지연돼도 무해.
# 매일 돈다(주말 포함). 주말엔 새 공시가 없어 대개 0건으로 끝나지만, 금요일 밤~일요일에
# 올라온 공시를 월요일까지 묵히지 않고 바로 잡는다.
# run.py는 최근 3영업일을 폴링한다 — 17시 실행이라 그날 저녁(17시 이후) 공시는 다음 날 잡힌다.
name: news

on:
  schedule:
    - cron: "0 8 * * *"       # KST 17:00 (매일)
  workflow_dispatch: {}       # 수동 실행 버튼 (테스트용)

# 앞선 실행이 끝나기 전에 다음 예약이 겹치면 취소(중복 생성 방지)
concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI (구독 기반 헤드리스 실행)
        # 버전을 고정한다. @latest로 뒀더니 매일 최신 버전을 새로 설치하는 구조라
        # 업스트림이 breaking change를 내면 우리 코드는 그대로인데 조용히 깨질 수 있다
        # (2026-09-02~09-04 뉴스룸이 매일 0건 생성하며 success로만 뜨던 사고 때 발견 —
        #  이 사고의 확정 원인은 CLAUDE_CODE_OAUTH_TOKEN 쪽으로 더 유력했지만,
        #  버전 고정 자체는 원인과 무관하게 해두는 게 맞는 안전장치라 같이 넣는다).
        # 새 버전으로 올리고 싶으면 이 숫자를 의도적으로 바꾸고 한 번 수동 실행(workflow_dispatch)
        # 해서 정상 동작을 확인한 뒤 커밋할 것.
        run: npm install -g @anthropic-ai/claude-code@2.1.261

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run newsroom pipeline
        env:
          PYTHONIOENCODING: utf-8
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 생성 모델. 저장소 변수 NEWS_CLAUDE_MODEL로 덮어쓸 수 있다(예: opus).
          NEWS_CLAUDE_MODEL: ${{ vars.NEWS_CLAUDE_MODEL || 'sonnet' }}
        run: python -m news.run
